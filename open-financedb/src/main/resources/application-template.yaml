# ============================================================
# application-template.yaml
# 复制此文件为 application-dev.yaml 或 application-build.yaml，
# 然后填入你的实际配置值。
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:superK}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:your_mysql_username}
    password: ${MYSQL_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

management:
  influx:
    metrics:
      export:
        enabled: true
        uri: ${INFLUXDB_URI:http://localhost:8086}
        org: ${INFLUXDB_ORG:your_org}
        bucket: ${INFLUXDB_BUCKET:your_bucket}
        token: ${INFLUXDB_TOKEN:your_influxdb_token}
        step: 10s

finance:
  startup:
    bootstrap-enabled: ${FINANCE_STARTUP_BOOTSTRAP:true}
  history-sync:
    enabled: ${FINANCE_HISTORY_SYNC:true}
    default-start-date: 2015-01-01
    idle-sleep: 30s
  adj-factor-sync:
    enabled: ${FINANCE_ADJ_FACTOR_SYNC:true}
    cron: ${FINANCE_ADJ_FACTOR_SYNC_CRON:0 0 23 * * ?}
    pool-size: ${FINANCE_ADJ_FACTOR_SYNC_POOL_SIZE:2}
  kline-aggregation:
    enabled: ${FINANCE_KLINE_AGGREGATION:true}
    idle-sleep: 30s
  realtime-sync:
    enabled: ${FINANCE_REALTIME_SYNC:true}
    pool-size: ${FINANCE_REALTIME_SYNC_POOL_SIZE:4}
    retry-sleep-millis: ${FINANCE_REALTIME_SYNC_RETRY_SLEEP_MILLIS:1000}
  http:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 1000
    connect-timeout: 10s
    read-timeout: 60s
    write-timeout: 60s
    call-timeout: 70s
  influx:
    uri: ${INFLUXDB_URI:http://localhost:8086}
    org: ${INFLUXDB_ORG:your_org}
    bucket: ${INFLUXDB_BUCKET:your_bucket}
    token: ${INFLUXDB_TOKEN:your_influxdb_token}
  tushare:
    live: ${TUSHARE_LIVE:false}
    http-url: ${TUSHARE_HTTP_URL:http://tushare.xyz}
    token: ${TUSHARE_TOKEN:your_tushare_token}
    qps:
      stk_mins: 5
      stock_basic: 1
      trade_cal: 1
      adj_factor: 2
      daily: 2
      income: 1
      fina_indicator: 1
      rt_min: 2
      rt_min_daily: 2
